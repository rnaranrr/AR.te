<!doctype html>
<html lang="pt-br" class="bg-fundo text-texto-main font-principal">

  <head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fontes do google - fira sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap">

    <!-- Fonte IMPACT -->
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/impact">

    <!-- Favicon -->
    <link id="theme-favicon" rel="icon" type="image/svg+xml">

    <link rel="stylesheet" href="./src/index.css">

    <!-- Script para atualizar o favicon com base nas preferências do usuário -->
    <script>
      const preference = window.matchMedia('(prefers-color-scheme: dark)');
      const favicon = document.getElementById('theme-favicon');

      function updateFavicon() {
        favicon.href = preference.matches
          ? '/assets/logo/icon-logo-light.svg?v=3'
          : '/assets/logo/icon-logo-dark.svg?v=3';
      }

      updateFavicon();
      preference.addEventListener('change', updateFavicon);
    </script>

    <title>AR.te</title>

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>

</html>
